name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Coverage (no kit at 0%)
        run: |
          out=$(go test -cover ./kits/... 2>&1)
          echo "$out"
          if echo "$out" | grep -qE '[[:space:]]0\.0% of statements'; then
            echo "a kit has 0% coverage (docs 究极渗透能力包实现方案.md §8)" >&2
            exit 1
          fi
      - name: Import + license boundaries
        run: ./scripts/check-imports.sh
      - name: Examples
        run: |
          go run ./examples/minimal
          go run ./examples/verify-chain
          go run ./examples/session
